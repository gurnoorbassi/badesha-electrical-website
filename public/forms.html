<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Badesha Electrical form definition</title></head>
  <body>
    <form name="project-inquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" action="/thank-you">
      <input type="hidden" name="form-name" value="project-inquiry">
      <input type="hidden" name="subject" value="New Badesha Electrical website inquiry">
      <input name="bot-field">
      <input name="name" type="text">
      <input name="email" type="email">
      <input name="phone" type="tel">
      <input name="location" type="text">
      <select name="service"><option>Residential electrical</option></select>
      <select name="preferred-contact"><option>Phone</option></select>
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" value="yes">
    </form>
  </body>
</html>
